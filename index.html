<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steel City Sharpening | Mobile & Pickup Knife Sharpening in Pittsburgh</title>
    <meta name="description" content="Professional knife, artisan whetstone, kitchen shear, and garden tool sharpening in Carnegie & Pittsburgh. Free local pickup & delivery within ~10 miles of Carnegie ($30 order minimum).">
    <style>
        :root {
            --bg-color: #111113;
            --card-bg: #19191d;
            --card-hover: #202026;
            --accent: #FFB612; /* Pittsburgh Gold */
            --accent-hover: #E3A008; /* Deeper Gold on Hover */
            --gold: #FFB612; /* Artisan Tier Accent */
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Header */
        header {
            background: rgba(17, 17, 19, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.85rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: var(--text-main);
            text-transform: uppercase;
            text-decoration: none;
        }

        .logo-img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            flex-shrink: 0;
        }

        .logo span {
            color: var(--accent);
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .nav-phone {
            background: var(--accent);
            color: #111113; /* Dark text for high contrast on gold */
            padding: 0.55rem 1.1rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .nav-phone:hover {
            background: var(--accent-hover);
        }

        /* Hero Section */
        .hero {
            padding: 5rem 2rem 6rem 2rem;
            text-align: center;
            background: linear-gradient(rgba(17, 17, 19, 0.82), rgba(17, 17, 19, 0.96)), 
                        url('https://images.unsplash.com/photo-1589365278144-c9e705f423ba?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            border-bottom: 1px solid var(--border);
        }

        .hero-logo {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            margin: 0 auto 1.25rem auto;
            display: block;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 182, 18, 0.15);
            color: var(--accent);
            border: 1px solid rgba(255, 182, 18, 0.4);
            padding: 0.35rem 0.9rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1.25rem;
        }

        .hero h1 {
            font-size: clamp(2.1rem, 5vw, 3.6rem);
            margin-bottom: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.15;
        }

        .hero p {
            font-size: clamp(1.05rem, 2vw, 1.25rem);
            color: var(--text-muted);
            max-width: 680px;
            margin: 0 auto 2.25rem auto;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-block;
            background: var(--accent);
            color: #111113;
            padding: 0.9rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 4px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            display: inline-block;
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.9rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 4px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: border-color 0.2s, background 0.2s;
        }

        .btn-secondary:hover {
            border-color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Highlights Strip */
        .highlights {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 2rem;
        }

        .highlights-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            text-align: center;
        }

        .highlight-item strong {
            display: block;
            color: var(--accent);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .highlight-item span {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Sections */
        section {
            padding: 4.5rem 2rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        section h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-muted);
            max-width: 620px;
            margin: 0 auto 3rem auto;
            font-size: 1rem;
        }

        /* Services & Pricing */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .service-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.2s;
        }

        .service-card:hover {
            border-color: var(--accent);
        }

        .service-card.artisan {
            border-color: rgba(255, 182, 18, 0.45);
        }

        .service-card.artisan:hover {
            border-color: var(--gold);
        }

        .artisan-tag {
            display: inline-block;
            background: rgba(255, 182, 18, 0.15);
            color: var(--gold);
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            margin-bottom: 0.6rem;
        }

        .service-img {
            width: 100%;
            height: 165px;
            object-fit: cover;
            border-bottom: 1px solid var(--border);
        }

        .service-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .service-card h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .service-card p {
            color: var(--text-muted);
            font-size: 0.92rem;
            margin-bottom: 1.25rem;
        }

        .price {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
        }

        .service-card.artisan .price {
            color: var(--gold);
        }

        .price-note {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
            margin-top: 0.2rem;
        }

        .pricing-disclaimer {
            margin-top: 2.25rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            padding: 1.35rem 1.6rem;
            border-radius: 4px;
            font-size: 0.92rem;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .pricing-disclaimer strong {
            color: var(--text-main);
        }

        /* Process */
        .process-steps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.75rem;
            text-align: center;
        }

        .step {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2.25rem 1.5rem;
            border-radius: 6px;
        }

        .step-number {
            display: inline-block;
            width: 44px;
            height: 44px;
            background: var(--accent);
            color: #111113;
            font-weight: 800;
            font-size: 1.1rem;
            line-height: 44px;
            border-radius: 50%;
            margin-bottom: 1rem;
        }

        .step h3 {
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .step p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Contact Section */
        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 2.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 2.5rem;
        }

        .contact-info h3 {
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .contact-info p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .contact-detail {
            margin-bottom: 1.25rem;
        }

        .contact-detail strong {
            display: block;
            color: var(--accent);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

            color: var(--text-main);
            text-decoration: none;
            font-size: 1.1rem;
